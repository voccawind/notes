version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://localhost:4000
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.server
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - DATA_PATH=/data
    volumes:
      - orbit-data:/data
    restart: unless-stopped

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - server
    restart: unless-stopped
    profiles:
      - production

volumes:
  orbit-data:
    driver: local
